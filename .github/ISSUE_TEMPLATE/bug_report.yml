name: Bug report
description: Something in Token Quotient does not work as it should, or a quote was far off.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Numbers and error messages are enough: please do not paste chat text, file contents, tokens or anything private.
        For a security problem, do not open an issue: see [SECURITY.md](https://github.com/Korvonordico/quotient-claude-tokens/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did Quotient do, and what did you expect instead? For a quote that was far off, give the level you chose, the estimate and the real cost.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      description: Where did it happen? Pick all that apply.
      multiple: true
      options:
        - Claude Code (terminal)
        - Claude Code in the Claude desktop app
        - Installments (rate)
        - Hermes Agent
        - quotient.py from a terminal
        - Shared-average service (server/)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Quotient version
      description: Shown in the Quotient line of the chat, or run `python scripts/quotient.py --version`.
      placeholder: "0.9.7"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: "`python --version`"
      placeholder: "3.13.1"
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: "`claude --version` (or the Hermes Agent version, if it happened there)"
  - type: textarea
    id: output
    attributes:
      label: Output and errors
      description: Error messages, or the relevant lines of `/token-quotient:report` or `rate status`. Remove anything private first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I searched the existing issues.
          required: true
        - label: What I pasted holds no chat text, tokens or other private data.
          required: true
