<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">Token Quotient 1.1.10: your limits, in percent and in tokens of the ceiling</title><desc id="desc">Two bars. The 5-hour limit: 19% used, 81% left, about 26 million of about 32 million weighted tokens left, resets at 16:30. The week: 5% used, 95% left, about 276 million of about 291 million left, resets Monday 26 at 06:00. Below, the line Quotient shows at each message, with the tokens left of the ceiling in brackets.</desc>
<style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}</style>
<rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M1 36 V11 a10 10 0 0 1 10 -10 H889 a10 10 0 0 1 10 10 V36 Z" fill="#161b22"/>
<line x1="1" y1="36" x2="899" y2="36" stroke="#30363d"/>
<circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
<text x="450" y="23" fill="#a2abb6" font-size="14" font-weight="normal" text-anchor="middle">Quotient · your limits</text>
<text x="30" y="93" fill="#e6edf3" font-size="17" font-weight="bold" text-anchor="start">5 hours</text>
<rect x="170" y="70" width="700" height="34" rx="7" fill="#56d364" fill-opacity="0.35"/>
<rect x="170" y="70" width="133.0" height="34" rx="7" fill="#e3b341"/>
<text x="317.0" y="93" font-size="15"><tspan fill="#e6edf3" font-weight="bold">81% left  </tspan><tspan fill="#e6edf3" font-weight="bold">~26M of ~32M wt</tspan></text>
<text x="170" y="124" fill="#808a95" font-size="13" font-weight="normal" text-anchor="start">19% used · resets 16:30</text>
<text x="30" y="177" fill="#e6edf3" font-size="17" font-weight="bold" text-anchor="start">week</text>
<rect x="170" y="154" width="700" height="34" rx="7" fill="#56d364" fill-opacity="0.35"/>
<rect x="170" y="154" width="35.0" height="34" rx="7" fill="#e3b341"/>
<text x="219.0" y="177" font-size="15"><tspan fill="#e6edf3" font-weight="bold">95% left  </tspan><tspan fill="#e6edf3" font-weight="bold">~276M of ~291M wt</tspan></text>
<text x="170" y="208" fill="#808a95" font-size="13" font-weight="normal" text-anchor="start">5% used · resets Mon 26 06:00</text>
<line x1="30" y1="232" x2="870" y2="232" stroke="#30363d"/>
<text x="30" y="258" fill="#a2abb6" font-size="14" font-weight="normal" text-anchor="start">The line at each message (Hermes) and the status line (Claude Code):</text>
<rect x="572" y="242" width="298" height="22" rx="11" fill="none" stroke="#56d364"/>
<text x="721" y="258" fill="#56d364" font-size="12" font-weight="normal" text-anchor="middle">tokens since 1.1.8 · ceiling 1.1.10</text>
<text x="30" y="290" font-size="14"><tspan fill="#e6edf3">Quotient · 5-hour: 19% used, 81% left </tspan><tspan fill="#56d364" font-weight="bold">(~26M of ~32M wt)</tspan><tspan fill="#e6edf3">, resets 16:30</tspan></text>
<text x="30" y="314" font-size="14"><tspan fill="#e6edf3">         · week: 5% used, 95% left </tspan><tspan fill="#56d364" font-weight="bold">(~276M of ~291M wt)</tspan><tspan fill="#e6edf3">, resets Mon 26 06:00</tspan></text>
<text x="30" y="348" fill="#808a95" font-size="12" font-weight="normal" text-anchor="start">~ = an estimate: how much 1% holds, measured on your PC (your plan's shared size until then), times</text>
<text x="30" y="366" fill="#808a95" font-size="12" font-weight="normal" text-anchor="start">100 for the ceiling and times the share left for the rest. The quotes use the same numbers.</text>
