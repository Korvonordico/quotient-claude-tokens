<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">Token Quotient 1.1.8: your limits, in percent and in tokens</title><desc id="desc">Two bars. The 5-hour limit: 19% used, 81% left, about 26 million weighted tokens left, resets at 16:30. The week: 5% used, 95% left, about 277 million weighted tokens left, resets Monday 26 at 06:00. Below, the line Quotient shows at each message, with the tokens left in brackets, new in 1.1.8.</desc>
<style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}</style>
<rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M1 36 V11 a10 10 0 0 1 10 -10 H889 a10 10 0 0 1 10 10 V36 Z" fill="#161b22"/>
<line x1="1" y1="36" x2="899" y2="36" stroke="#30363d"/>
<circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
<text x="450" y="23" fill="#a2abb6" font-size="14" font-weight="normal" text-anchor="middle">Quotient · your limits</text>
<text x="30" y="96" fill="#e6edf3" font-size="17" font-weight="bold" text-anchor="start">5 hours</text>
<rect x="150" y="80" width="420" height="22" rx="5" fill="#21262d"/>
<rect x="150" y="80" width="79.8" height="22" rx="5" fill="#e3b341"/>
<rect x="231.8" y="80" width="338.2" height="22" rx="5" fill="#56d364" fill-opacity="0.35"/>
<text x="588" y="96" fill="#e6edf3" font-size="17" font-weight="bold" text-anchor="start">81% left</text>
<text x="688" y="96" fill="#56d364" font-size="17" font-weight="bold" text-anchor="start">~26M wt</text>
<text x="150" y="124" fill="#808a95" font-size="14" font-weight="normal" text-anchor="start">19% used · resets 16:30</text>
<text x="30" y="176" fill="#e6edf3" font-size="17" font-weight="bold" text-anchor="start">week</text>
<rect x="150" y="160" width="420" height="22" rx="5" fill="#21262d"/>
<rect x="150" y="160" width="21.0" height="22" rx="5" fill="#e3b341"/>
<rect x="173.0" y="160" width="397.0" height="22" rx="5" fill="#56d364" fill-opacity="0.35"/>
<text x="588" y="176" fill="#e6edf3" font-size="17" font-weight="bold" text-anchor="start">95% left</text>
<text x="688" y="176" fill="#56d364" font-size="17" font-weight="bold" text-anchor="start">~277M wt</text>
<text x="150" y="204" fill="#808a95" font-size="14" font-weight="normal" text-anchor="start">5% used · resets Mon 26 06:00</text>
<line x1="30" y1="232" x2="870" y2="232" stroke="#30363d"/>
<text x="30" y="258" fill="#a2abb6" font-size="14" font-weight="normal" text-anchor="start">The line at each message (Hermes) and the status line (Claude Code):</text>
<rect x="746" y="242" width="124" height="22" rx="11" fill="none" stroke="#56d364"/>
<text x="808" y="258" fill="#56d364" font-size="13" font-weight="normal" text-anchor="middle">new in 1.1.8</text>
<text x="30" y="290" font-size="15"><tspan fill="#e6edf3">Quotient · 5-hour: 19% used, 81% left </tspan><tspan fill="#56d364" font-weight="bold">(~26M wt)</tspan><tspan fill="#e6edf3">, resets 16:30</tspan></text>
<text x="30" y="314" font-size="15"><tspan fill="#e6edf3">         · week: 5% used, 95% left </tspan><tspan fill="#56d364" font-weight="bold">(~277M wt)</tspan><tspan fill="#e6edf3">, resets Mon 26 06:00</tspan></text>
<text x="30" y="352" fill="#808a95" font-size="13" font-weight="normal" text-anchor="start">~ = an estimate: the share left × how much 1% holds, measured on your PC (your plan's shared</text>
<text x="30" y="370" fill="#808a95" font-size="13" font-weight="normal" text-anchor="start">size until then). It falls as you use the limit; the quotes use the same numbers.</text>
