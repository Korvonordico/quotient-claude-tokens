<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432" role="img" aria-label="An estimate of 1.50 million times 0.70 gives 1.05 million. Starting factors by type of work: code 0.70, writing 1.0, research 0.35, other 0.40." font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8e82" stop-opacity="0.34"/><stop offset="0.6" stop-color="#ff8e82" stop-opacity="0.08"/><stop offset="1" stop-color="#ff8e82" stop-opacity="0.2"/></linearGradient></defs><rect x="0" y="0" width="900" height="432" rx="24" fill="#0e1218"/><rect x="0" y="0" width="900" height="432" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="898" height="430" rx="23" fill="none" stroke="#ff8e82" stroke-opacity="0.65" stroke-width="2"/><text x="48" y="68" font-size="34" fill="#ff8e82" font-weight="700">It learns from your jobs</text><text x="48" y="106" font-size="21" fill="#f0f3f6">Each quote is corrected by how far off the earlier ones were.</text><rect x="48" y="136" width="804" height="86" rx="14" fill="#1a202a" stroke="#ff8e82" stroke-opacity="0.75"/><text x="82" y="190" font-size="34" fill="#f0f3f6" font-weight="700">1.50M</text><text x="190" y="190" font-size="20" fill="#c3ccd6">the model's estimate</text><text x="430" y="190" font-size="34" fill="#ff8e82" font-weight="700">x0.70</text><path d="M538 180 H588 M579 172 L588 180 L579 188" stroke="#ff8e82" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="610" y="190" font-size="34" fill="#f0f3f6" font-weight="700">1.05M</text><text x="716" y="190" font-size="20" fill="#c3ccd6">corrected</text><rect x="48" y="242" width="192" height="118" rx="14" fill="#1a202a" stroke="#343c48"/><text x="144" y="284" font-size="21" fill="#c3ccd6" text-anchor="middle">code</text><text x="144" y="334" font-size="38" fill="#ff8e82" font-weight="700" text-anchor="middle">x0.70</text><rect x="252" y="242" width="192" height="118" rx="14" fill="#1a202a" stroke="#343c48"/><text x="348" y="284" font-size="21" fill="#c3ccd6" text-anchor="middle">writing</text><text x="348" y="334" font-size="38" fill="#ff8e82" font-weight="700" text-anchor="middle">x1.0</text><rect x="456" y="242" width="192" height="118" rx="14" fill="#1a202a" stroke="#343c48"/><text x="552" y="284" font-size="21" fill="#c3ccd6" text-anchor="middle">research</text><text x="552" y="334" font-size="38" fill="#ff8e82" font-weight="700" text-anchor="middle">x0.35</text><rect x="660" y="242" width="192" height="118" rx="14" fill="#1a202a" stroke="#343c48"/><text x="756" y="284" font-size="21" fill="#c3ccd6" text-anchor="middle">other</text><text x="756" y="334" font-size="38" fill="#ff8e82" font-weight="700" text-anchor="middle">x0.40</text><text x="48" y="400" font-size="21" fill="#c3ccd6">Where each type starts, measured on 64 clean jobs. Then it learns from yours.</text></svg>
