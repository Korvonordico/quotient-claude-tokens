<svg xmlns="http://www.w3.org/2000/svg" width="900" height="412" viewBox="0 0 900 412" role="img" aria-label="A real job of 4.67 million weighted tokens: 2.82 million of work and 1.85 million re-reading the 165,000 tokens the chat started with, over 107 steps." font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f78cc6" stop-opacity="0.34"/><stop offset="0.6" stop-color="#f78cc6" stop-opacity="0.08"/><stop offset="1" stop-color="#f78cc6" stop-opacity="0.2"/></linearGradient></defs><rect x="0" y="0" width="900" height="412" rx="24" fill="#0e1218"/><rect x="0" y="0" width="900" height="412" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="898" height="410" rx="23" fill="none" stroke="#f78cc6" stroke-opacity="0.65" stroke-width="2"/><text x="48" y="68" font-size="34" fill="#f78cc6" font-weight="700">Why a long chat costs more</text><text x="48" y="106" font-size="21" fill="#f0f3f6">A real job: 4.67 million, and 1.85 of it was only re-reading.</text><rect x="48" y="142" width="485.499" height="66" rx="14" fill="#57d364"/><rect x="519.499" y="142" width="332.501" height="66" rx="14" fill="#f78cc6"/><text x="70" y="186" font-size="28" fill="#0e1218" font-weight="700">work 2.82M</text><text x="555.499" y="186" font-size="28" fill="#0e1218" font-weight="700">re-reading 1.85M</text><rect x="48" y="230" width="394" height="110" rx="14" fill="#1a202a" stroke="#343c48"/><rect x="458" y="230" width="394" height="110" rx="14" fill="#1a202a" stroke="#343c48"/><text x="245" y="276" font-size="30" fill="#f0f3f6" font-weight="700" text-anchor="middle">165,000 tokens</text><text x="245" y="314" font-size="20" fill="#c3ccd6" text-anchor="middle">in the chat when the job started</text><text x="655" y="276" font-size="30" fill="#f0f3f6" font-weight="700" text-anchor="middle">107 steps</text><text x="655" y="314" font-size="20" fill="#c3ccd6" text-anchor="middle">and each one reads it all again</text><text x="48" y="380" font-size="21" fill="#c3ccd6">When a chat has grown long, the window offers a new chat and says what that saves.</text></svg>
