<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="Claude Code and Hermes Agent both spend the same 5-hour and weekly limits, and Quotient counts both." font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fa8ff" stop-opacity="0.34"/><stop offset="0.6" stop-color="#9fa8ff" stop-opacity="0.08"/><stop offset="1" stop-color="#9fa8ff" stop-opacity="0.2"/></linearGradient></defs><rect x="0" y="0" width="900" height="430" rx="24" fill="#0e1218"/><rect x="0" y="0" width="900" height="430" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="898" height="428" rx="23" fill="none" stroke="#9fa8ff" stroke-opacity="0.65" stroke-width="2"/><text x="48" y="68" font-size="34" fill="#9fa8ff" font-weight="700">Hermes Agent too</text><text x="48" y="106" font-size="21" fill="#f0f3f6">With your Claude login, its chats spend the same limits.</text><rect x="48" y="142" width="340" height="84" rx="14" fill="#1a202a" stroke="#9fa8ff" stroke-opacity="0.75"/><text x="76" y="180" font-size="26" fill="#f0f3f6" font-weight="700">Claude Code</text><text x="76" y="208" font-size="19" fill="#c3ccd6">the plugin</text><path d="M396 184 H468 M459 176 L468 184 L459 192" stroke="#9fa8ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="242" width="340" height="84" rx="14" fill="#1a202a" stroke="#9fa8ff" stroke-opacity="0.75"/><text x="76" y="280" font-size="26" fill="#f0f3f6" font-weight="700">Hermes Agent</text><text x="76" y="308" font-size="19" fill="#c3ccd6">two hooks in its config</text><path d="M396 284 H468 M459 276 L468 284 L459 292" stroke="#9fa8ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="482" y="142" width="370" height="184" rx="18" fill="#9fa8ff" fill-opacity="0.2" stroke="#9fa8ff" stroke-width="2"/><text x="667" y="210" font-size="30" fill="#f0f3f6" font-weight="700" text-anchor="middle">The same limits</text><text x="667" y="250" font-size="22" fill="#c3ccd6" text-anchor="middle">5 hours and week</text><text x="667" y="286" font-size="22" fill="#9fa8ff" font-weight="600" text-anchor="middle">Quotient counts both</text><text x="48" y="368" font-size="21" fill="#c3ccd6">Quotes and job measures work inside Hermes too. Installments still run with</text><text x="48" y="398" font-size="21" fill="#c3ccd6">Claude Code. Quotient reads Hermes' counters only, never your messages.</text></svg>
