<svg xmlns="http://www.w3.org/2000/svg" width="900" height="456" viewBox="0 0 900 456" role="img" aria-label="Two bars: the 5-hour limit with 69 percent left, about 22 million of 32 million weighted tokens; the week with 94 percent left, about 270 million of 287 million." font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5a35c" stop-opacity="0.34"/><stop offset="0.6" stop-color="#f5a35c" stop-opacity="0.08"/><stop offset="1" stop-color="#f5a35c" stop-opacity="0.2"/></linearGradient></defs><rect x="0" y="0" width="900" height="456" rx="24" fill="#0e1218"/><rect x="0" y="0" width="900" height="456" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="898" height="454" rx="23" fill="none" stroke="#f5a35c" stroke-opacity="0.65" stroke-width="2"/><text x="48" y="68" font-size="34" fill="#f5a35c" font-weight="700">Your limits, always in view</text><text x="48" y="106" font-size="21" fill="#f0f3f6">What is left of the 5 hours and of the week, at each message.</text><rect x="48" y="136" width="804" height="104" rx="14" fill="#1a202a" stroke="#343c48"/><text x="76" y="178" font-size="26" fill="#f0f3f6" font-weight="700">5-hour</text><text x="226" y="178" font-size="22" fill="#c3ccd6">~22M of ~32M wt</text><text x="824" y="178" font-size="26" fill="#f5a35c" font-weight="700" text-anchor="end">69% left</text><rect x="76" y="196" width="748" height="16" rx="8" fill="#2b323d"/><rect x="76" y="196" width="516.12" height="16" rx="8" fill="#f5a35c"/><rect x="48" y="254" width="804" height="104" rx="14" fill="#1a202a" stroke="#343c48"/><text x="76" y="296" font-size="26" fill="#f0f3f6" font-weight="700">week</text><text x="226" y="296" font-size="22" fill="#c3ccd6">~270M of ~287M wt</text><text x="824" y="296" font-size="26" fill="#f5a35c" font-weight="700" text-anchor="end">94% left</text><rect x="76" y="314" width="748" height="16" rx="8" fill="#2b323d"/><rect x="76" y="314" width="703.12" height="16" rx="8" fill="#f5a35c"/><text x="48" y="394" font-size="21" fill="#c3ccd6">Example numbers: yours depend on your plan, and they reset on their own.</text><text x="48" y="426" font-size="21" fill="#c3ccd6">If this week's pace would reach the limit before it resets, it tells you once.</text></svg>
