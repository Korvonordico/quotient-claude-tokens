<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="Three days at 03:00. Each time the PC wakes, Claude works up to the cap, saves, and the PC goes back to sleep." font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c297ff" stop-opacity="0.34"/><stop offset="0.6" stop-color="#c297ff" stop-opacity="0.08"/><stop offset="1" stop-color="#c297ff" stop-opacity="0.2"/></linearGradient></defs><rect x="0" y="0" width="900" height="430" rx="24" fill="#0e1218"/><rect x="0" y="0" width="900" height="430" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="898" height="428" rx="23" fill="none" stroke="#c297ff" stroke-opacity="0.65" stroke-width="2"/><text x="48" y="68" font-size="34" fill="#c297ff" font-weight="700">Big jobs, a piece a night</text><text x="48" y="106" font-size="21" fill="#f0f3f6">Each piece has its own cap, and the week's reserve stays yours.</text><rect x="48" y="136" width="254" height="112" rx="14" fill="#1a202a" stroke="#c297ff" stroke-opacity="0.75"/><circle cx="90" cy="192" r="19" fill="#e8b949"/><circle cx="99" cy="186" r="16" fill="#1a202a"/><text x="128" y="183" font-size="20" fill="#c3ccd6">Day 1</text><text x="128" y="218" font-size="32" fill="#f0f3f6" font-weight="700">03:00</text><rect x="323" y="136" width="254" height="112" rx="14" fill="#1a202a" stroke="#c297ff" stroke-opacity="0.75"/><circle cx="365" cy="192" r="19" fill="#e8b949"/><circle cx="374" cy="186" r="16" fill="#1a202a"/><text x="403" y="183" font-size="20" fill="#c3ccd6">Day 2</text><text x="403" y="218" font-size="32" fill="#f0f3f6" font-weight="700">03:00</text><rect x="598" y="136" width="254" height="112" rx="14" fill="#1a202a" stroke="#c297ff" stroke-opacity="0.75"/><circle cx="640" cy="192" r="19" fill="#e8b949"/><circle cx="649" cy="186" r="16" fill="#1a202a"/><text x="678" y="183" font-size="20" fill="#c3ccd6">Day 3</text><text x="678" y="218" font-size="32" fill="#f0f3f6" font-weight="700">03:00</text><rect x="48" y="272" width="158" height="52" rx="26" fill="#c297ff" fill-opacity="0.2" stroke="#c297ff"/><text x="127" y="305" font-size="21" fill="#f0f3f6" text-anchor="middle">PC wakes</text><path d="M214 298 H248 M239 290 L248 298 L239 306" stroke="#c297ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="258" y="272" width="214" height="52" rx="26" fill="#c297ff" fill-opacity="0.2" stroke="#c297ff"/><text x="365" y="305" font-size="21" fill="#f0f3f6" text-anchor="middle">works to its cap</text><path d="M480 298 H514 M505 290 L514 298 L505 306" stroke="#c297ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="524" y="272" width="112" height="52" rx="26" fill="#c297ff" fill-opacity="0.2" stroke="#c297ff"/><text x="580" y="305" font-size="21" fill="#f0f3f6" text-anchor="middle">saves</text><path d="M644 298 H678 M669 290 L678 298 L669 306" stroke="#c297ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="688" y="272" width="158" height="52" rx="26" fill="#c297ff" fill-opacity="0.2" stroke="#c297ff"/><text x="767" y="305" font-size="21" fill="#f0f3f6" text-anchor="middle">PC sleeps</text><text x="48" y="366" font-size="21" fill="#c3ccd6">~507,465 a day, about 4 min each: a 3-day plan from a real quote.</text><text x="48" y="398" font-size="21" fill="#c3ccd6">The last 8% of each cap is kept for saving what it found.</text></svg>
