<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="The max level of a quote: about 23 minutes, about 3.9 percent of the 5 hours with 66 percent left, about 0.3 percent of the week with 49 percent left." font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6cb6ff" stop-opacity="0.34"/><stop offset="0.6" stop-color="#6cb6ff" stop-opacity="0.08"/><stop offset="1" stop-color="#6cb6ff" stop-opacity="0.2"/></linearGradient></defs><rect x="0" y="0" width="900" height="400" rx="24" fill="#0e1218"/><rect x="0" y="0" width="900" height="400" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="898" height="398" rx="23" fill="none" stroke="#6cb6ff" stroke-opacity="0.65" stroke-width="2"/><text x="48" y="68" font-size="34" fill="#6cb6ff" font-weight="700">How long, and how much of your limits</text><text x="48" y="106" font-size="21" fill="#f0f3f6">You see it before the work starts.</text><rect x="48" y="136" width="256" height="190" rx="14" fill="#1a202a" stroke="#6cb6ff" stroke-opacity="0.75"/><text x="176" y="186" font-size="20" fill="#c3ccd6" text-anchor="middle">Expected time</text><text x="176" y="248" font-size="46" fill="#6cb6ff" font-weight="700" text-anchor="middle">~23 min</text><text x="176" y="288" font-size="18" fill="#c3ccd6" text-anchor="middle">learned from your own jobs</text><rect x="322" y="136" width="256" height="190" rx="14" fill="#1a202a" stroke="#343c48"/><text x="450" y="186" font-size="20" fill="#c3ccd6" text-anchor="middle">5 hours</text><text x="450" y="248" font-size="46" fill="#f0f3f6" font-weight="700" text-anchor="middle">~3.9%</text><rect x="350" y="268" width="200" height="12" rx="6" fill="#2b323d"/><rect x="350" y="268" width="132" height="12" rx="6" fill="#6cb6ff"/><text x="450" y="310" font-size="18" fill="#c3ccd6" text-anchor="middle">66% left after it</text><rect x="596" y="136" width="256" height="190" rx="14" fill="#1a202a" stroke="#343c48"/><text x="724" y="186" font-size="20" fill="#c3ccd6" text-anchor="middle">Week</text><text x="724" y="248" font-size="46" fill="#f0f3f6" font-weight="700" text-anchor="middle">~0.3%</text><rect x="624" y="268" width="200" height="12" rx="6" fill="#2b323d"/><rect x="624" y="268" width="98" height="12" rx="6" fill="#6cb6ff"/><text x="724" y="310" font-size="18" fill="#c3ccd6" text-anchor="middle">49% left after it</text><text x="48" y="368" font-size="21" fill="#c3ccd6">This is the max level of a real quote. Every level shows the same three numbers.</text></svg>
