r="end" fill="#e6edf3">60k</text><text x="568.0" y="168.0" textLength="16.8" lengthAdjust="spacing" text-anchor="end" fill="#e6edf3">5%</text><text x="656.0" y="168.0" textLength="16.8" lengthAdjust="spacing" text-anchor="end" fill="#e6edf3">1%</text></g><g id="a7" class="an"><text x="58.0" y="190.0" textLength="33.6" lengthAdjust="spacing" fill="#e6edf3" font-weight="700">good</text><text x="156.0" y="190.0" textLength="210.0" lengthAdjust="spacing" fill="#a2abb6">+ new tests, docs updated</text><text x="468.0" y="190.0" textLength="33.6" lengthAdjust="spacing" text-anchor="end" fill="#e6edf3">150k</text><text x="568.0" y="190.0" textLength="25.2" lengthAdjust="spacing" text-anchor="end" fill="#e6edf3">12%</text><text x="656.0" y="190.0" textLength="16.8" lengthAdjust="spacing" text-anchor="end" fill="#e6edf3">3%</text></g><g id="a8" class="an"><text x="58.0" y="212.0" textLength="25.2" lengthAdjust="spacing" fill="#e6edf3" font-weight="700">max</text><text x="156.0" y="212.0" textLength="210.0" lengthAdjust="spacing" fill="#a2abb6">+ edge cases, full review</text><text x="468.0" y="212.0" textLength="33.6" lengthAdjust="spacing" text-anchor="end" fill="#e6edf3">300k</text><text x="568.0" y="212.0" textLength="25.2" lengthAdjust="spacing" text-anchor="end" fill="#e6edf3">24%</text><text x="656.0" y="212.0" textLength="16.8" lengthAdjust="spacing" text-anchor="end" fill="#e6edf3">6%</text></g><g id="a9" class="an"><line x1="29" y1="224" x2="679" y2="224" stroke="#262c35"/><text x="58.0" y="246.0" textLength="31.6" lengthAdjust="spacing" font-size="11.5" fill="#808a95">PACE</text><text x="156.0" y="246.0" textLength="453.6" lengthAdjust="spacing"><tspan fill="#e6edf3">all today</tspan><tspan fill="#808a95">  ·  </tspan><tspan fill="#e6edf3">2 days, ~75k a day</tspan><tspan fill="#808a95">  ·  </tspan><tspan fill="#a2abb6">or write your own</tspan></text></g><g id="a10" class="an"><text x="28.0" y="281.0" textLength="525.0" lengthAdjust="spacing" font-size="12.5" fill="#808a95">Estimates are not guaranteed: they get closer with every finished job.</text></g><g id="a11" class="an"><text x="28.0" y="310.0" textLength="277.2" lengthAdjust="spacing"><tspan fill="#e3b341" font-weight="700">&gt; </tspan><tspan fill="#a2abb6">Level: </tspan><tspan fill="#e3b341" font-weight="700">good</tspan><tspan fill="#808a95">  ·  </tspan><tspan fill="#a2abb6">Pace: </tspan><tspan fill="#e6edf3">all today</tspan></text></g><g id="a12" class="an"><text x="28.0" y="332.0" textLength="218.4" lengthAdjust="spacing" fill="#808a95">CHOICE: good   PACE: today</text></g><g id="a13" class="an"><text x="28.0" y="360.0" textLength="285.6" lengthAdjust="spacing"><tspan fill="#56d364">● </tspan><tspan fill="#e6edf3">Working: </tspan><tspan fill="#a2abb6">14 files read, 9 edited</tspan></text></g><g id="a14" class="an"><text x="28.0" y="382.0" textLength="151.2" lengthAdjust="spacing"><tspan fill="#56d364">● </tspan><tspan fill="#e6edf3">Tests: </tspan><tspan fill="#a2abb6">48 passed</tspan></text></g><g id="a15" class="an"><text x="28.0" y="404.0" textLength="84.0" lengthAdjust="spacing" fill="#808a95">JOB: CLOSE</text></g><g id="a16" class="an"><text x="28.0" y="432.0" textLength="420.0" lengthAdjust="spacing"><tspan fill="#56d364" font-weight="700">✓ </tspan><tspan fill="#56d364" font-weight="700">Actual: </tspan><tspan fill="#e6edf3" font-weight="700">142k tokens</tspan><tspan fill="#a2abb6"> (est. 150k)</tspan><tspan fill="#a2abb6"> · factor updated</tspan></text></g><g id="a17" class="an" opacity="0"><text x="28.0" y="476.0" textLength="462.0" lengthAdjust="spacing"><tspan fill="#e3b341" font-weight="700">&gt; </tspan><tspan fill="#e6edf3">Now write the user guide: 12 chapters, with examples.</tspan></text></g><g id="a18" class="an" opacity="0"><rect x="43.8" y="460" width="461.6" height="23" fill="#0d1117"/><rect x="45.3" y="464" width="6.9" height="16" fill="#e3b341" opacity="0.9"/></g><g id="a19" class="an" opacity="0"><text x="28.0" y="506.0" textLengt