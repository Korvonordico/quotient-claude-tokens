<svg xmlns="http://www.w3.org/2000/svg" width="900" height="414" viewBox="0 0 900 414" role="img" aria-label="A choice of three levels with their totals: essential 216,247, good 540,616, max 1.01 million weighted tokens." font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8b949" stop-opacity="0.34"/><stop offset="0.6" stop-color="#e8b949" stop-opacity="0.08"/><stop offset="1" stop-color="#e8b949" stop-opacity="0.2"/></linearGradient></defs><rect x="0" y="0" width="900" height="414" rx="24" fill="#0e1218"/><rect x="0" y="0" width="900" height="414" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="898" height="412" rx="23" fill="none" stroke="#e8b949" stroke-opacity="0.65" stroke-width="2"/><text x="48" y="68" font-size="34" fill="#e8b949" font-weight="700">Pick a level</text><text x="48" y="106" font-size="21" fill="#f0f3f6">One to four levels, more for a bigger job. Claude waits for your choice.</text><rect x="48" y="136" width="804" height="62" rx="14" fill="#1a202a" stroke="#343c48"/><circle cx="80" cy="167" r="11" fill="none" stroke="#8b96a3" stroke-width="2.5"/><text x="106" y="175" font-size="24" fill="#f0f3f6">Essential</text><rect x="248" y="159" width="370" height="16" rx="8" fill="#2b323d"/><rect x="248" y="159" width="79.2192" height="16" rx="8" fill="#8e98a6"/><text x="830" y="175" font-size="24" fill="#f0f3f6" font-weight="600" text-anchor="end">216,247</text><rect x="48" y="210" width="804" height="62" rx="14" fill="#1a202a" stroke="#e8b949" stroke-opacity="0.75"/><circle cx="80" cy="241" r="11" fill="#e8b949" stroke="#e8b949" stroke-width="2.5"/><text x="106" y="249" font-size="24" fill="#e8b949" font-weight="700">Good</text><rect x="248" y="233" width="370" height="16" rx="8" fill="#2b323d"/><rect x="248" y="233" width="198.047" height="16" rx="8" fill="#e8b949"/><text x="830" y="249" font-size="24" fill="#f0f3f6" font-weight="600" text-anchor="end">540,616</text><rect x="48" y="284" width="804" height="62" rx="14" fill="#1a202a" stroke="#343c48"/><circle cx="80" cy="315" r="11" fill="none" stroke="#8b96a3" stroke-width="2.5"/><text x="106" y="323" font-size="24" fill="#f0f3f6">Max</text><rect x="248" y="307" width="370" height="16" rx="8" fill="#2b323d"/><rect x="248" y="307" width="370" height="16" rx="8" fill="#8e98a6"/><text x="830" y="323" font-size="24" fill="#f0f3f6" font-weight="600" text-anchor="end">1.01 million</text><text x="48" y="384" font-size="21" fill="#c3ccd6">Or write your own: "the good one, plus the tests of the max".</text></svg>
