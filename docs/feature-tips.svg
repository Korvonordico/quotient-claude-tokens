<svg xmlns="http://www.w3.org/2000/svg" width="900" height="494" viewBox="0 0 900 494" role="img" aria-label="A real chat of 21.67 million weighted tokens: the terminal took about 34%, screen photos 15%, the browser 10% and writing files 10%. Tips come with the most useful first, can be put off or dropped, and never ask for shorter replies." font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f78cc6" stop-opacity="0.34"/><stop offset="0.6" stop-color="#f78cc6" stop-opacity="0.08"/><stop offset="1" stop-color="#f78cc6" stop-opacity="0.2"/></linearGradient></defs><rect x="0" y="0" width="900" height="494" rx="24" fill="#0e1218"/><rect x="0" y="0" width="900" height="494" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="898" height="492" rx="23" fill="none" stroke="#f78cc6" stroke-opacity="0.65" stroke-width="2"/><text x="48" y="68" font-size="34" fill="#f78cc6" font-weight="700">Where the tokens go</text><text x="48" y="106" font-size="21" fill="#f0f3f6">A real chat, tool by tool. Off by default: config tips.level 1 or 2.</text><text x="48" y="166" font-size="24" fill="#f0f3f6">the terminal</text><rect x="270" y="142" width="500" height="32" rx="16" fill="#2b323d"/><rect x="270" y="142" width="170" height="32" rx="16" fill="#f78cc6"/><text x="852" y="166" font-size="24" fill="#f0f3f6" font-weight="700" text-anchor="end">34%</text><text x="48" y="218" font-size="24" fill="#f0f3f6">screen photos</text><rect x="270" y="194" width="500" height="32" rx="16" fill="#2b323d"/><rect x="270" y="194" width="75" height="32" rx="16" fill="#57d364"/><text x="852" y="218" font-size="24" fill="#f0f3f6" font-weight="700" text-anchor="end">15%</text><text x="48" y="270" font-size="24" fill="#f0f3f6">the browser</text><rect x="270" y="246" width="500" height="32" rx="16" fill="#2b323d"/><rect x="270" y="246" width="50" height="32" rx="16" fill="#57d364"/><text x="852" y="270" font-size="24" fill="#f0f3f6" font-weight="700" text-anchor="end">10%</text><text x="48" y="322" font-size="24" fill="#f0f3f6">writing files</text><rect x="270" y="298" width="500" height="32" rx="16" fill="#2b323d"/><rect x="270" y="298" width="50" height="32" rx="16" fill="#57d364"/><text x="852" y="322" font-size="24" fill="#f0f3f6" font-weight="700" text-anchor="end">10%</text><rect x="48" y="354" width="804" height="70" rx="14" fill="#1a202a" stroke="#343c48"/><text x="450" y="398" font-size="24" fill="#f0f3f6" font-weight="700" text-anchor="middle">The most useful tip first; put one off or drop it.</text><text x="48" y="462" font-size="21" fill="#c3ccd6">Estimates from the logs, numbers only. A tip never asks for shorter replies.</text></svg>
