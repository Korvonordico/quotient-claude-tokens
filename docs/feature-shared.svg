<svg xmlns="http://www.w3.org/2000/svg" width="900" height="446" viewBox="0 0 900 446" role="img" aria-label="The shared average for Opus: 65 jobs, factor 1.18, middle half from 0.52 to 1.89. Sonnet, Haiku, Fable and other have no average yet." font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4dd0d6" stop-opacity="0.34"/><stop offset="0.6" stop-color="#4dd0d6" stop-opacity="0.08"/><stop offset="1" stop-color="#4dd0d6" stop-opacity="0.2"/></linearGradient></defs><rect x="0" y="0" width="900" height="446" rx="24" fill="#0e1218"/><rect x="0" y="0" width="900" height="446" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="898" height="444" rx="23" fill="none" stroke="#4dd0d6" stroke-opacity="0.65" stroke-width="2"/><text x="48" y="68" font-size="34" fill="#4dd0d6" font-weight="700">A start from other people's numbers</text><text x="48" y="106" font-size="21" fill="#f0f3f6">Until your own numbers are enough, an average fills in, by model.</text><rect x="48" y="136" width="804" height="136" rx="14" fill="#1a202a" stroke="#4dd0d6" stroke-opacity="0.75"/><text x="76" y="186" font-size="28" fill="#4dd0d6" font-weight="700">opus</text><text x="76" y="224" font-size="20" fill="#c3ccd6">65 jobs</text><rect x="230" y="196" width="590" height="10" rx="5" fill="#2b323d"/><rect x="385.846" y="196" width="274.616" height="10" rx="5" fill="#4dd0d6"/><circle cx="560.221" cy="201" r="12" fill="#f0f3f6"/><text x="560.221" y="178" font-size="26" fill="#f0f3f6" font-weight="700" text-anchor="middle">x1.18</text><text x="385.846" y="240" font-size="20" fill="#c3ccd6" text-anchor="middle">x0.52</text><text x="660.462" y="240" font-size="20" fill="#c3ccd6" text-anchor="middle">x1.89</text><rect x="48" y="288" width="192" height="54" rx="14" fill="none" stroke="#8b96a3" stroke-dasharray="6 5"/><text x="144" y="322" font-size="21" fill="#c3ccd6" text-anchor="middle">sonnet</text><rect x="252" y="288" width="192" height="54" rx="14" fill="none" stroke="#8b96a3" stroke-dasharray="6 5"/><text x="348" y="322" font-size="21" fill="#c3ccd6" text-anchor="middle">haiku</text><rect x="456" y="288" width="192" height="54" rx="14" fill="none" stroke="#8b96a3" stroke-dasharray="6 5"/><text x="552" y="322" font-size="21" fill="#c3ccd6" text-anchor="middle">fable</text><rect x="660" y="288" width="192" height="54" rx="14" fill="none" stroke="#8b96a3" stroke-dasharray="6 5"/><text x="756" y="322" font-size="21" fill="#c3ccd6" text-anchor="middle">other</text><text x="48" y="382" font-size="21" fill="#c3ccd6">The other models have no average yet. Numbers as of 21 October 2026.</text><text x="48" y="414" font-size="21" fill="#c3ccd6">The band is the middle half of the jobs. Sharing is optional.</text></svg>
