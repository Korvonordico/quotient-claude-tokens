<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">Token Quotient 1.2.0: i tuoi limiti, in percentuale e in token del tetto</title><desc id="desc">Due barre. Il limite delle 5 ore: usato 19%, resta 81%, restano circa 26 milioni su circa 32 milioni di token pesati, si azzera alle 16:30. La settimana: usato 5%, resta 95%, restano circa 276 milioni su circa 291, si azzera lunedì 26 alle 06:00. Sotto, la riga che Quotient mostra a ogni messaggio, con i token che restano del tetto tra parentesi.</desc>
<style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}</style>
<rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M1 36 V11 a10 10 0 0 1 10 -10 H889 a10 10 0 0 1 10 10 V36 Z" fill="#161b22"/>
<line x1="1" y1="36" x2="899" y2="36" stroke="#30363d"/>
<circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
<text x="450" y="23" fill="#a2abb6" font-size="14" font-weight="normal" text-anchor="middle">Quotient · i tuoi limiti</text>
<text x="30" y="93" fill="#e6edf3" font-size="17" font-weight="bold" text-anchor="start">5 ore</text>
<rect x="170" y="70" width="700" height="34" rx="7" fill="#56d364" fill-opacity="0.35"/>
<rect x="170" y="70" width="133.0" height="34" rx="7" fill="#e3b341"/>
<text x="317.0" y="93" font-size="15"><tspan fill="#e6edf3" font-weight="bold">resta 81%  </tspan><tspan fill="#e6edf3" font-weight="bold">~26M su ~32M wt</tspan></text>
<text x="170" y="124" fill="#808a95" font-size="13" font-weight="normal" text-anchor="start">usato 19% · si azzera 16:30</text>
<text x="30" y="177" fill="#e6edf3" font-size="17" font-weight="bold" text-anchor="start">settimana</text>
<rect x="170" y="154" width="700" height="34" rx="7" fill="#56d364" fill-opacity="0.35"/>
<rect x="170" y="154" width="35.0" height="34" rx="7" fill="#e3b341"/>
<text x="219.0" y="177" font-size="15"><tspan fill="#e6edf3" font-weight="bold">resta 95%  </tspan><tspan fill="#e6edf3" font-weight="bold">~276M su ~291M wt</tspan></text>
<text x="170" y="208" fill="#808a95" font-size="13" font-weight="normal" text-anchor="start">usato 5% · si azzera lun 26 06:00</text>
<line x1="30" y1="232" x2="870" y2="232" stroke="#30363d"/>
<text x="30" y="258" fill="#a2abb6" font-size="14" font-weight="normal" text-anchor="start">La riga a ogni messaggio (Hermes) e la riga di stato (Claude Code):</text>
<rect x="596" y="242" width="274" height="22" rx="11" fill="none" stroke="#56d364"/>
<text x="733" y="258" fill="#56d364" font-size="12" font-weight="normal" text-anchor="middle">token dalla 1.1.8 · tetto 1.2.0</text>
<text x="30" y="290" font-size="14"><tspan fill="#e6edf3">Quotient · 5 ore: usato 19%, resta 81% </tspan><tspan fill="#56d364" font-weight="bold">(~26M su ~32M wt)</tspan><tspan fill="#e6edf3">, si azzera 16:30</tspan></text>
<text x="30" y="314" font-size="14"><tspan fill="#e6edf3">         · settimana: usato 5%, resta 95% </tspan><tspan fill="#56d364" font-weight="bold">(~276M su ~291M wt)</tspan><tspan fill="#e6edf3">, si azzera lun 26 06:00</tspan></text>
<text x="30" y="348" fill="#808a95" font-size="12" font-weight="normal" text-anchor="start">~ = una stima: quanto vale l'1%, misurato sul tuo PC (finché non c'è, quello comune del tuo piano),</text>
<text x="30" y="366" fill="#808a95" font-size="12" font-weight="normal" text-anchor="start">per 100 dà il tetto, per la parte che resta dà il resto. I preventivi usano gli stessi numeri.</text>
</svg>
