<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">Token Quotient 1.1.8: i tuoi limiti, in percentuale e in token</title><desc id="desc">Due barre. Il limite delle 5 ore: usato 19%, resta 81%, restano circa 26 milioni di token pesati, si azzera alle 16:30. La settimana: usato 5%, resta 95%, restano circa 277 milioni di token pesati, si azzera lunedì 26 alle 06:00. Sotto, la riga che Quotient mostra a ogni messaggio, con i token che restano tra parentesi, novità della 1.1.8.</desc>
<style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}</style>
<rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M1 36 V11 a10 10 0 0 1 10 -10 H889 a10 10 0 0 1 10 10 V36 Z" fill="#161b22"/>
<line x1="1" y1="36" x2="899" y2="36" stroke="#30363d"/>
<circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
<text x="450" y="23" fill="#a2abb6" font-size="14" font-weight="normal" text-anchor="middle">Quotient · i tuoi limiti</text>
<text x="30" y="96" fill="#e6edf3" font-size="17" font-weight="bold" text-anchor="start">5 ore</text>
<rect x="150" y="80" width="420" height="22" rx="5" fill="#21262d"/>
<rect x="150" y="80" width="79.8" height="22" rx="5" fill="#e3b341"/>
<rect x="231.8" y="80" width="338.2" height="22" rx="5" fill="#56d364" fill-opacity="0.35"/>
<text x="588" y="96" fill="#e6edf3" font-size="17" font-weight="bold" text-anchor="start">resta 81%</text>
<text x="699" y="96" fill="#56d364" font-size="17" font-weight="bold" text-anchor="start">~26M wt</text>
<text x="150" y="124" fill="#808a95" font-size="14" font-weight="normal" text-anchor="start">usato 19% · si azzera 16:30</text>
<text x="30" y="176" fill="#e6edf3" font-size="17" font-weight="bold" text-anchor="start">settimana</text>
<rect x="150" y="160" width="420" height="22" rx="5" fill="#21262d"/>
<rect x="150" y="160" width="21.0" height="22" rx="5" fill="#e3b341"/>
<rect x="173.0" y="160" width="397.0" height="22" rx="5" fill="#56d364" fill-opacity="0.35"/>
<text x="588" y="176" fill="#e6edf3" font-size="17" font-weight="bold" text-anchor="start">resta 95%</text>
<text x="699" y="176" fill="#56d364" font-size="17" font-weight="bold" text-anchor="start">~277M wt</text>
<text x="150" y="204" fill="#808a95" font-size="14" font-weight="normal" text-anchor="start">usato 5% · si azzera lun 26 06:00</text>
<line x1="30" y1="232" x2="870" y2="232" stroke="#30363d"/>
<text x="30" y="258" fill="#a2abb6" font-size="14" font-weight="normal" text-anchor="start">La riga a ogni messaggio (Hermes) e la riga di stato (Claude Code):</text>
<rect x="746" y="242" width="124" height="22" rx="11" fill="none" stroke="#56d364"/>
<text x="808" y="258" fill="#56d364" font-size="13" font-weight="normal" text-anchor="middle">novità 1.1.8</text>
<text x="30" y="290" font-size="15"><tspan fill="#e6edf3">Quotient · 5 ore: usato 19%, resta 81% </tspan><tspan fill="#56d364" font-weight="bold">(~26M wt)</tspan><tspan fill="#e6edf3">, si azzera 16:30</tspan></text>
<text x="30" y="314" font-size="15"><tspan fill="#e6edf3">         · settimana: usato 5%, resta 95% </tspan><tspan fill="#56d364" font-weight="bold">(~277M wt)</tspan><tspan fill="#e6edf3">, si azzera lun 26 06:00</tspan></text>
<text x="30" y="352" fill="#808a95" font-size="13" font-weight="normal" text-anchor="start">~ = una stima: la parte che resta × quanto vale l'1%, misurato sul tuo PC (finché non c'è,</text>
<text x="30" y="370" fill="#808a95" font-size="13" font-weight="normal" text-anchor="start">quello comune del tuo piano). Scende mentre usi il limite; i preventivi usano gli stessi numeri.</text>
</svg>
